name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish installers (select main when publishing)'
        type: choice
        options: [none, development, versioned]
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a release halfway through uploading its installers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  verify:
    name: metadata + tests
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release-plan.outputs.channel }}
      tag: ${{ steps.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate version and choose release channel
        id: release-plan
        run: node scripts/release-utils.mjs plan
        env:
          RELEASE_CHANNEL: ${{ inputs.publish || 'none' }}

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Regenerate metadata from the schema dumps + the TrinityCore wiki and
      # fail if the committed artefacts are stale.
      - name: Fetch TrinityCore documentation
        run: npm run metadata:fetch-docs

      - name: Rebuild metadata from the SQL dumps and docs
        run: npm run metadata

      - name: Check generated metadata is up to date
        run: |
          if ! git diff --quiet -- resources/metadata; then
            echo "::error::resources/metadata is stale — run 'npm run metadata' and commit the result"
            git diff --stat -- resources/metadata
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # npm test builds first so bundle-driven tests cannot pass by skipping.
      - name: Build and test core / shipped UI
        run: npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser workflows, responsive layouts and accessibility
        run: npx playwright test

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  installers:
    name: ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux installers
            artifact: linux
          - os: windows-latest
            name: windows installers
            artifact: windows
          - os: macos-latest
            name: macos installers
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and node bundles
        run: npm run build

      - name: Package desktop installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify every expected installer exists
        run: node scripts/release-utils.mjs check --platform ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: wyrmrest-editor-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish ${{ needs.verify.outputs.channel }} release
    if: needs.verify.outputs.channel != 'none'
    needs: [verify, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: wyrmrest-editor-*
          path: artifacts
          merge-multiple: true
      - name: Publish installers and SHA-256 checksums
        run: node scripts/publish-release.mjs --channel "$RELEASE_CHANNEL" --assets artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
