<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2635"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d488"/>
      <stop offset="0.55" stop-color="#d8b45c"/>
      <stop offset="1" stop-color="#a9702a"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#plate)" stroke="#2f3c52" stroke-width="8"/>

  <!-- a wyrm, drawn as one stroke: head at the left, body curling to a tail -->
  <path d="M96 336
           C96 214 190 150 268 168
           C338 184 356 246 316 276
           C282 302 232 288 226 252
           C221 220 248 198 276 204"
        fill="none" stroke="url(#fire)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 336 C150 400 244 420 322 386" fill="none" stroke="#4aa3df" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <circle cx="150" cy="232" r="15" fill="#dde4ef"/>

  <!-- the editor half: a caret of SQL in the corner -->
  <path d="M330 128 L372 168 L330 208" fill="none" stroke="#4aa3df" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M392 214 L352 122" stroke="#63c98a" stroke-width="20" stroke-linecap="round"/>
</svg>
